[project]
name = "agent-shield"
version = "0.1.0"
description = "Indirect prompt-injection benchmark for document-reading finance agents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "typer>=0.27.3",
]

[project.scripts]
injbench = "injbench.cli:app"

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "injbench"

# CPU-only torch on Linux (CI); the default PyPI wheels there pull CUDA (~2.5 GB).
# Windows/macOS PyPI wheels are already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Telugu text and spotlighting markers (ˆ) are intentional non-ASCII.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Protected after T02: the agent can't re-sort them, and `ruff check --fix .` must not rewrite them.
"tests/acceptance/**" = ["I001"]

[tool.ruff.lint.isort]
# Otherwise ruff classifies `injbench.<mod>` by whether <mod> exists yet, so import order flips
# as each task adds a module.
known-first-party = ["injbench"]

[tool.ruff.format]
# Ruff formats code blocks in Markdown; keep it off the planning docs' illustrative snippets.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default: live tests deselected; non-loopback connections refused by pytest-socket.
# Loopback stays open because asyncio on Windows builds its self-pipe from a TCP socketpair.
addopts = "-m 'not live' --allow-hosts=127.0.0.1,::1"
markers = [
    "live: calls real provider APIs (uses quota); excluded by default, run with -m live",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
]
